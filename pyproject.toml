[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkwell"
version = "0.1.0"
description = "Personal local AI novel-writing workbench"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=44.0.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.0",
    "psutil>=7.2.2",
    "pydantic>=2.11.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.5",
    "types-psutil==7.2.2.20261122",
]

[tool.uv]
required-version = ">=0.13.8"

[tool.hatch.build.targets.wheel]
packages = ["backend", "service"]

[tool.pyright]
include = ["backend", "service", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
pythonPlatform = "Windows"
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
venvPath = "."
venv = ".venv"
